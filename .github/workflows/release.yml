name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 0.0.4)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: trop-release
  cancel-in-progress: false

env:
  FFMPEG_KIT_TAG: v9.0.0

jobs:
  release:
    name: Build and publish release
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "Run releases from the main branch." >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH format (for example, 0.0.4)." >&2
            exit 1
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists." >&2
            exit 1
          fi

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Cache ffmpeg-kit XCFrameworks
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-kit-xcframeworks
          key: ffmpeg-kit-${{ env.FFMPEG_KIT_TAG }}-arm64+sim-openssl-${{ runner.os }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build/DerivedDataApp
          key: trop-dd-${{ runner.os }}-${{ hashFiles('Trop.xcodeproj/**', '**/Package.resolved', 'Trop/**/*.swift') }}
          restore-keys: |
            trop-dd-${{ runner.os }}-

      - name: Make build script executable
        run: chmod +x ./build_ipa.sh

      - name: Build release IPA
        run: ./build_ipa.sh
        env:
          FFMPEG_KIT_TAG: ${{ env.FFMPEG_KIT_TAG }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
          MARKETING_VERSION: ${{ inputs.version }}

      - name: Generate release notes from changes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(gh api "repos/${REPOSITORY}/releases/latest" --jq '.tag_name')"
          gh api --method POST "repos/${REPOSITORY}/releases/generate-notes" \
            -f tag_name="v${VERSION}" \
            -f target_commitish=main \
            -f previous_tag_name="${PREVIOUS_TAG}" > release-notes-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(Path("release-notes-response.json").read_text())
          body = response["body"].strip()
          if not body:
              raise SystemExit("GitHub generated empty release notes; refusing to publish.")
          Path("release-notes.md").write_text(
              f"{body}\n\n[Discord](https://discord.gg/QrMwZAfU97)\n"
          )
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" build/Trop.ipa \
            --title "v${VERSION}" \
            --notes-file release-notes.md

      - name: Update AltStore source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          IPA_PATH="build/Trop.ipa"
          export SIZE="$(stat -f%z "$IPA_PATH")"
          export DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/Trop.ipa"
          export RELEASE_NOTES="$(cat release-notes.md)"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("altstore.json")
          source = json.loads(path.read_text())
          app = source["apps"][0]
          entry = {
              "version": os.environ["VERSION"],
              "buildVersion": os.environ["BUILD_NUMBER"],
              "date": os.environ["DATE"],
              "localizedDescription": os.environ["RELEASE_NOTES"],
              "downloadURL": os.environ["DOWNLOAD_URL"],
              "size": int(os.environ["SIZE"]),
              "minOSVersion": "26.0",
          }
          app["versions"] = [entry]
          path.write_text(json.dumps(source, indent=2) + "\n")
          print(f"Updated altstore.json -> {entry['version']} ({entry['size']} bytes)")
          PY

      - name: Commit AltStore source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore.json
          if git diff --cached --quiet; then
            echo "altstore.json unchanged"
            exit 0
          fi
          git commit -m "altstore.json: publish release v${VERSION} [skip ci]"
          git push origin HEAD:main
